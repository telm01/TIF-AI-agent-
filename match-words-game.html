<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match It! Word & Picture Game</title>
<style>
  :root{
    --bg: #F5F8F7;
    --panel: #FFFFFF;
    --ink: #33424A;
    --ink-soft: #5A6B72;
    --teal: #4F9CA3;
    --teal-dark: #3C7E85;
    --lilac: #9C8FC7;
    --success: #7FB88A;
    --success-bg: #E8F5EA;
    --try-again: #E3A857;
    --try-again-bg: #FBF1DF;
    --border: #DCE6E5;
    --focus: #2E6E75;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Trebuchet MS', Verdana, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  .app {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 18px;
  }

  header h1 {
    font-size: clamp(1.6rem, 5vw, 2.3rem);
    margin: 6px 0 2px;
    color: var(--teal-dark);
    letter-spacing: 0.5px;
  }

  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 1.05rem;
  }

  .header-icon {
    font-size: 2.4rem;
    line-height: 1;
  }

  .controls {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }

  .control-group label {
    font-size: 0.85rem;
    color: var(--ink-soft);
    font-weight: bold;
  }

  select, .icon-toggle {
    font-family: inherit;
    font-size: 1rem;
    padding: 8px 12px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: #fff;
    color: var(--ink);
  }

  select:focus, .icon-toggle:focus, button:focus, .card:focus {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .icon-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }

  .icon-toggle input { width: 18px; height: 18px; cursor: pointer; }

  .btn {
    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;
    padding: 10px 20px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: var(--teal);
    color: #fff;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .btn:hover { background: var(--teal-dark); }
  .btn:active { transform: scale(0.97); }
  .btn.secondary {
    background: #fff;
    color: var(--teal-dark);
    border: 2px solid var(--teal);
  }
  .btn.secondary:hover { background: #EAF4F4; }

  .status-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    font-size: 1.05rem;
    color: var(--ink-soft);
  }

  .progress-track {
    width: 180px;
    height: 12px;
    background: var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--success);
    width: 0%;
    transition: width 0.3s ease;
  }

  .message-banner {
    text-align: center;
    min-height: 32px;
    font-size: 1.15rem;
    font-weight: bold;
    color: var(--teal-dark);
    margin-bottom: 10px;
    transition: opacity 0.2s ease;
  }

  .board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  @media (max-width: 560px) {
    .board { gap: 14px; }
  }

  .column h2 {
    text-align: center;
    font-size: 1.1rem;
    color: var(--ink-soft);
    margin: 0 0 12px;
  }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    background: var(--panel);
    border: 3px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    min-height: 68px;
    font-size: 1.25rem;
    color: var(--ink);
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }

  .card .emoji { font-size: 1.8rem; }

  .card:hover:not(.matched) {
    border-color: var(--teal);
    transform: translateY(-1px);
  }

  .card.selected {
    border-color: var(--teal-dark);
    background: #EAF4F4;
  }

  .card.matched {
    border-color: var(--success);
    background: var(--success-bg);
    cursor: default;
    color: var(--ink-soft);
  }

  .card.matched .check {
    margin-left: auto;
    font-size: 1.3rem;
  }

  .card.shake {
    border-color: var(--try-again);
    background: var(--try-again-bg);
  }
  @media (prefers-reduced-motion: no-preference) {
    .card.shake { animation: shake 0.4s ease; }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .card.pulse {
    animation: none;
  }
  @media (prefers-reduced-motion: no-preference) {
    .card.matched.pulse { animation: pulse 0.35s ease; }
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  .celebration {
    text-align: center;
    background: var(--success-bg);
    border: 2px solid var(--success);
    border-radius: var(--radius);
    padding: 26px 18px;
    margin-top: 10px;
  }
  .celebration .big-emoji { font-size: 3rem; }
  .celebration h2 { color: var(--teal-dark); margin: 6px 0; }
  .celebration p { color: var(--ink-soft); margin: 0 0 16px; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-icon" aria-hidden="true">🧩</div>
    <h1>Match It!</h1>
    <p>Click a word. Then click its picture.</p>
  </header>

  <div class="controls">
    <div class="control-group">
      <label for="category-select">Word group</label>
      <select id="category-select">
        <option value="animals">Animals</option>
        <option value="fruits">Fruits</option>
        <option value="shapes">Shapes</option>
        <option value="colors">Colors</option>
      </select>
    </div>
    <div class="control-group">
      <label for="count-select">How many words</label>
      <select id="count-select">
        <option value="3">3</option>
        <option value="4" selected>4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
    </div>
    <div class="control-group">
      <label for="sound-toggle">&nbsp;</label>
      <label class="icon-toggle" for="sound-toggle">
        <input type="checkbox" id="sound-toggle">
        <span id="sound-label">🔇 Sound off</span>
      </label>
    </div>
    <div class="control-group">
      <label>&nbsp;</label>
      <button class="btn secondary" id="new-round-btn">🔄 New Words</button>
    </div>
  </div>

  <div class="status-bar">
    <span id="progress-text">0 of 4 matched</span>
    <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0" id="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="message-banner" id="message-banner" aria-live="polite">Pick a word to start!</div>

  <div class="board" id="board">
    <div class="column">
      <h2>Words</h2>
      <div class="card-list" id="words-list"></div>
    </div>
    <div class="column">
      <h2>Pictures</h2>
      <div class="card-list" id="pics-list"></div>
    </div>
  </div>

  <div class="celebration" id="celebration" style="display:none;" role="status">
    <div class="big-emoji" aria-hidden="true">🎉</div>
    <h2>Great job!</h2>
    <p>You matched every word with its picture.</p>
    <button class="btn" id="play-again-btn">Play Again</button>
  </div>
</div>

<script>
  const CATEGORIES = {
    animals: [
      { word: "Dog", emoji: "🐶" },
      { word: "Cat", emoji: "🐱" },
      { word: "Rabbit", emoji: "🐰" },
      { word: "Elephant", emoji: "🐘" },
      { word: "Lion", emoji: "🦁" },
      { word: "Turtle", emoji: "🐢" },
      { word: "Frog", emoji: "🐸" },
      { word: "Bird", emoji: "🐦" },
    ],
    fruits: [
      { word: "Apple", emoji: "🍎" },
      { word: "Banana", emoji: "🍌" },
      { word: "Grapes", emoji: "🍇" },
      { word: "Strawberry", emoji: "🍓" },
      { word: "Orange", emoji: "🍊" },
      { word: "Watermelon", emoji: "🍉" },
      { word: "Pineapple", emoji: "🍍" },
      { word: "Kiwi", emoji: "🥝" },
    ],
    shapes: [
      { word: "Circle", emoji: "🔵" },
      { word: "Square", emoji: "🟪" },
      { word: "Triangle", emoji: "🔺" },
      { word: "Star", emoji: "⭐" },
      { word: "Heart", emoji: "💛" },
      { word: "Diamond", emoji: "🔶" },
    ],
    colors: [
      { word: "Red", emoji: "🔴" },
      { word: "Blue", emoji: "🔵" },
      { word: "Green", emoji: "🟢" },
      { word: "Yellow", emoji: "🟡" },
      { word: "Purple", emoji: "🟣" },
      { word: "Orange", emoji: "🟠" },
    ],
  };

  const categorySelect = document.getElementById('category-select');
  const countSelect = document.getElementById('count-select');
  const soundToggle = document.getElementById('sound-toggle');
  const soundLabel = document.getElementById('sound-label');
  const newRoundBtn = document.getElementById('new-round-btn');
  const playAgainBtn = document.getElementById('play-again-btn');
  const wordsList = document.getElementById('words-list');
  const picsList = document.getElementById('pics-list');
  const board = document.getElementById('board');
  const celebration = document.getElementById('celebration');
  const messageBanner = document.getElementById('message-banner');
  const progressText = document.getElementById('progress-text');
  const progressFill = document.getElementById('progress-fill');
  const progressBar = document.getElementById('progress-bar');

  let pairs = [];
  let matchedCount = 0;
  let selectedWordId = null;
  let selectedPicId = null;
  let audioCtx = null;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function playTone(freqs, duration) {
    if (!soundToggle.checked) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      freqs.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.08, now + 0.02 + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration + i * 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + duration + i * 0.08 + 0.05);
      });
    } catch (e) { /* audio not available, fail silently */ }
  }

  function playSuccessSound() { playTone([523.25, 659.25, 783.99], 0.25); } // C E G gentle chime
  function playTrySound() { playTone([349.23], 0.2); } // single soft low tone

  soundToggle.addEventListener('change', () => {
    soundLabel.textContent = soundToggle.checked ? '🔊 Sound on' : '🔇 Sound off';
  });

  function startRound() {
    const catKey = categorySelect.value;
    const count = parseInt(countSelect.value, 10);
    const source = CATEGORIES[catKey];
    const chosen = shuffle(source).slice(0, count);

    pairs = chosen.map((item, idx) => ({ id: 'pair-' + idx, word: item.word, emoji: item.emoji }));
    matchedCount = 0;
    selectedWordId = null;
    selectedPicId = null;

    celebration.style.display = 'none';
    board.style.display = 'grid';
    messageBanner.textContent = 'Pick a word to start!';

    renderColumn(wordsList, shuffle(pairs), 'word');
    renderColumn(picsList, shuffle(pairs), 'pic');
    updateProgress();
  }

  function renderColumn(container, items, type) {
    container.innerHTML = '';
    items.forEach(pair => {
      const card = document.createElement('div');
      card.className = 'card';
      card.tabIndex = 0;
      card.dataset.pairId = pair.id;
      card.dataset.type = type;
      card.setAttribute('role', 'button');

      if (type === 'word') {
        card.innerHTML = `<span>${pair.word}</span>`;
        card.setAttribute('aria-label', 'Word: ' + pair.word);
      } else {
        card.innerHTML = `<span class="emoji" aria-hidden="true">${pair.emoji}</span><span class="sr-only">picture</span>`;
        card.setAttribute('aria-label', 'Picture for a word');
      }

      card.addEventListener('click', () => handleCardClick(card, pair, type));
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          handleCardClick(card, pair, type);
        }
      });

      container.appendChild(card);
    });
  }

  function handleCardClick(card, pair, type) {
    if (card.classList.contains('matched')) return;

    if (type === 'word') {
      clearSelectionClass('word');
      selectedWordId = pair.id;
      card.classList.add('selected');
    } else {
      clearSelectionClass('pic');
      selectedPicId = pair.id;
      card.classList.add('selected');
    }

    if (selectedWordId && selectedPicId) {
      evaluateMatch();
    } else {
      messageBanner.textContent = type === 'word'
        ? 'Now find its picture!'
        : 'Now find its word!';
    }
  }

  function clearSelectionClass(type) {
    const list = type === 'word' ? wordsList : picsList;
    list.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
  }

  function evaluateMatch() {
    const wordCard = wordsList.querySelector(`.card[data-pair-id="${selectedWordId}"][data-type="word"]`);
    const picCard = picsList.querySelector(`.card[data-pair-id="${selectedPicId}"][data-type="pic"]`);

    if (selectedWordId === selectedPicId) {
      wordCard.classList.remove('selected');
      picCard.classList.remove('selected');
      wordCard.classList.add('matched', 'pulse');
      picCard.classList.add('matched', 'pulse');
      wordCard.innerHTML += '<span class="check" aria-hidden="true">✅</span>';
      wordCard.tabIndex = -1;
      picCard.tabIndex = -1;
      matchedCount++;
      messageBanner.textContent = 'Great match! 🌟';
      playSuccessSound();
      updateProgress();

      if (matchedCount === pairs.length) {
        setTimeout(showCelebration, 500);
      }
    } else {
      wordCard.classList.add('shake');
      picCard.classList.add('shake');
      messageBanner.textContent = 'Not quite — try again!';
      playTrySound();
      setTimeout(() => {
        wordCard.classList.remove('shake', 'selected');
        picCard.classList.remove('shake', 'selected');
      }, 450);
    }

    selectedWordId = null;
    selectedPicId = null;
  }

  function updateProgress() {
    progressText.textContent = `${matchedCount} of ${pairs.length} matched`;
    const pct = pairs.length ? (matchedCount / pairs.length) * 100 : 0;
    progressFill.style.width = pct + '%';
    progressBar.setAttribute('aria-valuemax', pairs.length);
    progressBar.setAttribute('aria-valuenow', matchedCount);
  }

  function showCelebration() {
    board.style.display = 'none';
    messageBanner.textContent = '';
    celebration.style.display = 'block';
    celebration.focus?.();
  }

  newRoundBtn.addEventListener('click', startRound);
  playAgainBtn.addEventListener('click', startRound);
  categorySelect.addEventListener('change', startRound);
  countSelect.addEventListener('change', startRound);

  startRound();
</script>
</body>
</html>
