<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хэлний тоглоом</title>
<style>
  :root{
    --bg-top: #1b2340;
    --bg-bottom: #2a1a45;
    --panel: #1a2036;
    --panel-border: rgba(255,255,255,0.08);
    --ink: #F4F6FA;
    --ink-soft: #A9B3C9;
    --teal: #5DD8F0;
    --teal-dark: #3FB9DC;
    --lilac: #9C6FE0;
    --success: #6FE0A0;
    --success-bg: rgba(111, 224, 160, 0.12);
    --try-again: #F0B15D;
    --try-again-bg: rgba(240, 177, 93, 0.12);
    --hint-bg: rgba(156, 111, 224, 0.14);
    --hint-border: rgba(156, 111, 224, 0.5);
    --border: rgba(255,255,255,0.12);
    --focus: #5DD8F0;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(circle at 20% 15%, #24345e 0%, var(--bg-top) 35%, var(--bg-bottom) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Trebuchet MS', Verdana, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  .app { max-width: 90vw; margin: 0 auto; padding: 20px 16px 100px; }

  header { text-align: center; margin-bottom: 18px; }
  .header-icon { font-size: 2.4rem; line-height: 1; }
  header h1 { font-size: clamp(1.6rem, 5vw, 2.3rem); margin: 6px 0 2px; color: var(--teal); }
  header p { margin: 0; color: var(--ink-soft); font-size: 1.05rem; }

  .controls {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 14px 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }
  .control-group { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .control-group label { font-size: 0.85rem; color: var(--ink-soft); font-weight: bold; }

  select, .icon-toggle {
    font-family: inherit; font-size: 1rem; padding: 8px 12px; border-radius: 10px;
    border: 2px solid var(--border); background: #10152a; color: var(--ink);
  }

  select:focus, .icon-toggle:focus, button:focus, .choice-btn:focus, .word-btn:focus {
    outline: 3px solid var(--focus); outline-offset: 2px;
  }

  .icon-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .icon-toggle input { width: 18px; height: 18px; cursor: pointer; }

  .btn {
    font-family: inherit; font-size: 1rem; font-weight: bold; padding: 10px 20px; border-radius: 12px;
    border: none; cursor: pointer;
    background: linear-gradient(90deg, var(--teal), var(--lilac));
    color: #10152a;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(0.97); }
  .btn.secondary { background: transparent; color: var(--teal); border: 2px solid var(--teal); }
  .btn.secondary:hover { background: rgba(93, 216, 240, 0.1); }
  .btn.ghost { background: transparent; color: var(--lilac); border: 2px solid var(--lilac); }
  .btn.ghost:hover { background: rgba(156, 111, 224, 0.12); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .status-bar { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 1.05rem; color: var(--ink-soft); }
  .progress-track { width: 180px; height: 12px; background: rgba(255,255,255,0.1); border-radius: 8px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--lilac)); width: 0%; transition: width 0.3s ease; }

  .message-banner { text-align: center; min-height: 32px; font-size: 1.15rem; font-weight: bold; color: var(--teal); margin-bottom: 6px; }
  .prompt { text-align: center; font-size: 1.15rem; color: var(--ink); margin-bottom: 18px; }

  .kb-hint {
    text-align: center;
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }
  .kb-hint kbd {
    background: #10152a;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 6px;
    font-family: inherit;
    color: var(--teal);
  }

  .hint-box {
    display: none; text-align: center; background: var(--hint-bg); border: 2px solid var(--hint-border);
    border-radius: 12px; padding: 10px 16px; margin: 0 auto 18px; max-width: 480px; color: #D9CBFA; font-size: 1rem;
  }
  .hint-box.visible { display: block; }

  .game-panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius); padding: 60px 20px; }

  /* Picture-word mode */
  .picture-box {
    width: 140px; height: 140px; margin: 0 auto 28px; border-radius: 20px;
    background: #10152a; border: 3px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 4.5rem;
  }
  .word-choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .word-btn {
    font-family: inherit; font-size: 1.15rem; font-weight: bold; padding: 14px 20px; border-radius: 14px;
    border: 3px solid var(--border); background: #10152a; color: var(--ink); cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .word-btn:hover:not(:disabled) { border-color: var(--teal); transform: translateY(-1px); }
  .word-btn.correct { border-color: var(--success); background: var(--success-bg); }
  .word-btn.shake { border-color: var(--try-again); background: var(--try-again-bg); }

  /* Missing-letter mode */
  .word-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 28px; }
  .letter-box {
    width: 62px; height: 72px; border-radius: 12px; background: #10152a; border: 3px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold;
  }
  .letter-box.blank { background: var(--hint-bg); border-color: var(--hint-border); color: var(--lilac); }
  .letter-box.filled-correct { background: var(--success-bg); border-color: var(--success); }

  .choices-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .choice-btn {
    width: 62px; height: 62px; border-radius: 14px; border: 3px solid var(--border);
    background: #10152a; font-size: 1.6rem; font-weight: bold; cursor: pointer; color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--teal); transform: translateY(-1px); }
  .choice-btn.correct { border-color: var(--success); background: var(--success-bg); }
  .choice-btn.shake { border-color: var(--try-again); background: var(--try-again-bg); }

  @media (prefers-reduced-motion: no-preference) {
    .shake { animation: shake 0.4s ease; }
    .correct, .filled-correct { animation: pulse 0.35s ease; }
  }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }
  @keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.08);} 100%{transform:scale(1);} }

  .next-row { text-align: center; margin-top: 24px; }

  .celebration { text-align: center; background: var(--panel); border: 2px solid var(--success); border-radius: var(--radius); padding: 26px 18px; }
  .celebration .big-emoji { font-size: 3rem; }
  .celebration h2 { color: var(--teal); margin: 6px 0; }
  .celebration p { color: var(--ink-soft); margin: 0 0 16px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-icon" aria-hidden="true">🔤</div>
    <h1>Хэлний тоглоом</h1>
    <p>Үг, зургаа таньж сурцгаая</p>
  </header>

  <div class="controls">
    <div class="control-group">
      <label for="mode-select">Тоглоом</label>
      <select id="mode-select">
        <option value="picture">Зургийг нэрлэе</option>
        <option value="letter">Дутуу үсгийг ол</option>
      </select>
    </div>
    <div class="control-group">
      <label for="difficulty-select">Түвшин</label>
      <select id="difficulty-select">
        <option value="easy">Хялбар</option>
        <option value="medium" selected>Дунд</option>
        <option value="hard">Хэцүү</option>
      </select>
    </div>
    <div class="control-group">
      <label for="sound-toggle">&nbsp;</label>
      <label class="icon-toggle" for="sound-toggle">
        <input type="checkbox" id="sound-toggle">
        <span id="sound-label">🔇 Дуу хаалттай</span>
      </label>
    </div>
    <div class="control-group">
      <label>&nbsp;</label>
      <button class="btn secondary" id="restart-btn">🔄 Дахин эхлэх</button>
    </div>
  </div>

  <div class="status-bar">
    <span id="progress-text">Бодлого 1 / 5</span>
    <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" id="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="message-banner" id="message-banner" aria-live="polite">Аажуухан бодоцгооё!</div>
  <p class="kb-hint">⌨️ <kbd>←</kbd><kbd>→</kbd> сонголт хооронд шилжих, <kbd>Enter</kbd> сонгох, <kbd>Esc</kbd> дахин эхлэх, <kbd>Delete</kbd> өөр бодлого</p>

  <div id="play-area">
    <p class="prompt" id="prompt-text">Энэ юу вэ?</p>
    <div class="hint-box" id="hint-box"></div>

    <div class="game-panel">
      <div id="picture-mode-ui">
        <div class="picture-box" id="picture-box"></div>
        <div class="word-choices" id="word-choices"></div>
      </div>
      <div id="letter-mode-ui" style="display:none;">
        <div class="word-row" id="word-row"></div>
        <div class="choices-row" id="letter-choices-row"></div>
      </div>
    </div>

    <div class="next-row">
      <button class="btn ghost" id="hint-btn">💡 Тусламж</button>
      <button class="btn" id="next-btn" style="display:none;">Дараагийн бодлого →</button>
    </div>
  </div>

  <div class="celebration" id="celebration" style="display:none;" role="status">
    <div class="big-emoji" aria-hidden="true">🎉</div>
    <h2>Маш сайн бодлоо!</h2>
    <p>Чи 5 бодлогыг бүгдийг бодлоо.</p>
    <button class="btn" id="play-again-btn">Дахин тоглох</button>
  </div>
</div>

<script>
  const VOCAB = [
    { word: "нохой", emoji: "🐶" }, { word: "муур", emoji: "🐱" }, { word: "туулай", emoji: "🐰" },
    { word: "заан", emoji: "🐘" }, { word: "арслан", emoji: "🦁" }, { word: "мэлхий", emoji: "🐸" },
    { word: "шувуу", emoji: "🐦" }, { word: "алим", emoji: "🍎" }, { word: "гадил", emoji: "🍌" },
    { word: "жүрж", emoji: "🍊" }, { word: "тарвас", emoji: "🍉" }, { word: "машин", emoji: "🚗" },
    { word: "автобус", emoji: "🚌" }, { word: "дугуй", emoji: "🚲" }, { word: "онгоц", emoji: "✈️" },
    { word: "нар", emoji: "☀️" }, { word: "бороо", emoji: "🌧️" }, { word: "үүл", emoji: "☁️" },
    { word: "цас", emoji: "❄️" }, { word: "ном", emoji: "📖" }, { word: "мод", emoji: "🌳" },
    { word: "гэр", emoji: "🏠" },
  ];

  const LETTER_WORDS_EASY = ["нар", "цас", "мод", "ном", "гар", "ус", "гал"];
  const LETTER_WORDS_MEDIUM = ["нохой", "муур", "алим", "заан", "шувуу", "жүрж"];
  const LETTER_WORDS_HARD = ["туулай", "мэлхий", "автобус", "тарвас", "арслан"];

  const LETTER_POOL = "абвгдежзийклмноөпрстуүфхцчшья".split("");

  const TOTAL_ROUNDS = 5;

  const modeSelect = document.getElementById('mode-select');
  const difficultySelect = document.getElementById('difficulty-select');
  const soundToggle = document.getElementById('sound-toggle');
  const soundLabel = document.getElementById('sound-label');
  const restartBtn = document.getElementById('restart-btn');
  const playAgainBtn = document.getElementById('play-again-btn');
  const progressText = document.getElementById('progress-text');
  const progressFill = document.getElementById('progress-fill');
  const progressBar = document.getElementById('progress-bar');
  const messageBanner = document.getElementById('message-banner');
  const promptText = document.getElementById('prompt-text');
  const hintBox = document.getElementById('hint-box');
  const hintBtn = document.getElementById('hint-btn');
  const nextBtn = document.getElementById('next-btn');
  const playArea = document.getElementById('play-area');
  const celebration = document.getElementById('celebration');
  const pictureUI = document.getElementById('picture-mode-ui');
  const letterUI = document.getElementById('letter-mode-ui');
  const pictureBox = document.getElementById('picture-box');
  const wordChoices = document.getElementById('word-choices');
  const wordRow = document.getElementById('word-row');
  const letterChoicesRow = document.getElementById('letter-choices-row');

  let currentRoundIndex = 0;
  let currentRound = null;
  let solved = false;
  let audioCtx = null;

  function focusFirstChoice(container) {
    const el = container.querySelector('button:not([disabled]), [role="button"]:not(.disabled)');
    if (el) el.focus();
  }

  function attachRovingNav(container) {
    container.addEventListener('keydown', (e) => {
      if (!['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp'].includes(e.key)) return;
      const items = Array.from(container.querySelectorAll('button:not([disabled]), [role="button"]:not(.disabled)'));
      if (!items.length) return;
      const currentIndex = items.indexOf(document.activeElement);
      let nextIndex;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        nextIndex = currentIndex < 0 ? 0 : (currentIndex + 1) % items.length;
      } else {
        nextIndex = currentIndex < 0 ? items.length - 1 : (currentIndex - 1 + items.length) % items.length;
      }
      e.preventDefault();
      items[nextIndex].focus();
    });
  }

  attachRovingNav(wordChoices);
  attachRovingNav(letterChoicesRow);

  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'select') return;
    if (e.key === 'Escape') {
      e.preventDefault();
      restartBtn.click();
    } else if (e.key === 'Delete') {
      e.preventDefault();
      renderRound();
    }
  });

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function playTone(freqs, duration) {
    if (!soundToggle.checked) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      freqs.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.08, now + 0.02 + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration + i * 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + duration + i * 0.08 + 0.05);
      });
    } catch (e) {}
  }
  function playSuccessSound() { playTone([523.25, 659.25, 783.99], 0.25); }
  function playTrySound() { playTone([349.23], 0.2); }

  soundToggle.addEventListener('change', () => {
    soundLabel.textContent = soundToggle.checked ? '🔊 Дуу нээлттэй' : '🔇 Дуу хаалттай';
  });

  function buildPictureRound(difficulty) {
    const choiceCount = difficulty === 'easy' ? 3 : difficulty === 'medium' ? 4 : 5;
    const correct = VOCAB[Math.floor(Math.random() * VOCAB.length)];
    const distractors = shuffle(VOCAB.filter(v => v.word !== correct.word)).slice(0, choiceCount - 1);
    const choices = shuffle([correct, ...distractors]);
    return {
      type: 'picture',
      emoji: correct.emoji,
      answer: correct.word,
      choices: choices.map(c => c.word),
      hint: `Энэ зургийн нэр "${correct.word}" гэдэг үгтэй адилхан эхэлдэг.`,
    };
  }

  function buildLetterRound(difficulty) {
    const wordList = difficulty === 'easy' ? LETTER_WORDS_EASY : difficulty === 'medium' ? LETTER_WORDS_MEDIUM : LETTER_WORDS_HARD;
    const word = wordList[Math.floor(Math.random() * wordList.length)];
    const letters = Array.from(word);
    const blankIndex = Math.floor(Math.random() * letters.length);
    const correctLetter = letters[blankIndex];
    const choiceCount = difficulty === 'easy' ? 3 : 4;
    const distractorPool = shuffle(LETTER_POOL.filter(l => l !== correctLetter));
    const choices = shuffle([correctLetter, ...distractorPool.slice(0, choiceCount - 1)]);
    return {
      type: 'letter',
      word, letters, blankIndex, answer: correctLetter, choices,
      hint: `Үгийг чангаар уншиж, дутуу дууг сонсож үзээрэй: "${word}".`,
    };
  }

  function generateRound() {
    const mode = modeSelect.value;
    const difficulty = difficultySelect.value;
    return mode === 'picture' ? buildPictureRound(difficulty) : buildLetterRound(difficulty);
  }

  function renderRound() {
    solved = false;
    hintBox.classList.remove('visible');
    hintBox.textContent = '';
    nextBtn.style.display = 'none';
    messageBanner.textContent = 'Аажуухан бодоцгооё!';

    currentRound = generateRound();

    if (currentRound.type === 'picture') {
      pictureUI.style.display = 'block';
      letterUI.style.display = 'none';
      promptText.textContent = 'Энэ юу вэ?';
      renderPicture(currentRound);
    } else {
      pictureUI.style.display = 'none';
      letterUI.style.display = 'block';
      promptText.textContent = 'Дутуу үсгийг ол';
      renderLetter(currentRound);
    }

    updateProgress();
  }

  function renderPicture(round) {
    pictureBox.textContent = round.emoji;
    pictureBox.setAttribute('aria-hidden', 'true');

    wordChoices.innerHTML = '';
    round.choices.forEach(word => {
      const btn = document.createElement('button');
      btn.className = 'word-btn';
      btn.textContent = word;
      btn.addEventListener('click', () => handlePictureChoice(btn, word));
      wordChoices.appendChild(btn);
    });
    focusFirstChoice(wordChoices);
  }

  function handlePictureChoice(btn, word) {
    if (solved) return;
    if (word === currentRound.answer) {
      solved = true;
      btn.classList.add('correct');
      wordChoices.querySelectorAll('.word-btn').forEach(b => b.disabled = true);
      messageBanner.textContent = 'Маш сайн! 🌟';
      playSuccessSound();
      nextBtn.style.display = 'inline-block';
      nextBtn.focus();
    } else {
      btn.classList.add('shake');
      messageBanner.textContent = 'Дахин оролдоорой, чи чадна!';
      playTrySound();
      setTimeout(() => btn.classList.remove('shake'), 450);
    }
  }

  function renderLetter(round) {
    wordRow.innerHTML = '';
    round.letters.forEach((letter, i) => {
      const box = document.createElement('div');
      if (i === round.blankIndex) {
        box.className = 'letter-box blank';
        box.id = 'blank-letter-box';
        box.textContent = '?';
      } else {
        box.className = 'letter-box';
        box.textContent = letter;
      }
      wordRow.appendChild(box);
    });

    letterChoicesRow.innerHTML = '';
    round.choices.forEach(letter => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = letter;
      btn.setAttribute('aria-label', `"${letter}" үсэг сонгох`);
      btn.addEventListener('click', () => handleLetterChoice(btn, letter));
      letterChoicesRow.appendChild(btn);
    });
    focusFirstChoice(letterChoicesRow);
  }

  function handleLetterChoice(btn, letter) {
    if (solved) return;
    if (letter === currentRound.answer) {
      solved = true;
      const blank = document.getElementById('blank-letter-box');
      blank.textContent = letter;
      blank.classList.remove('blank');
      blank.classList.add('filled-correct');
      btn.classList.add('correct');
      letterChoicesRow.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
      messageBanner.textContent = 'Маш сайн! 🌟';
      playSuccessSound();
      nextBtn.style.display = 'inline-block';
      nextBtn.focus();
    } else {
      btn.classList.add('shake');
      messageBanner.textContent = 'Дахин оролдоорой, чи чадна!';
      playTrySound();
      setTimeout(() => btn.classList.remove('shake'), 450);
    }
  }

  function updateProgress() {
    progressText.textContent = `Бодлого ${currentRoundIndex + 1} / ${TOTAL_ROUNDS}`;
    const pct = (currentRoundIndex / TOTAL_ROUNDS) * 100;
    progressFill.style.width = pct + '%';
    progressBar.setAttribute('aria-valuenow', currentRoundIndex);
  }

  function showCelebration() {
    playArea.style.display = 'none';
    messageBanner.textContent = '';
    celebration.style.display = 'block';
  }

  function startSession() {
    currentRoundIndex = 0;
    playArea.style.display = 'block';
    celebration.style.display = 'none';
    renderRound();
  }

  hintBtn.addEventListener('click', () => {
    hintBox.textContent = '💡 ' + currentRound.hint;
    hintBox.classList.add('visible');
  });

  nextBtn.addEventListener('click', () => {
    currentRoundIndex++;
    if (currentRoundIndex >= TOTAL_ROUNDS) {
      progressFill.style.width = '100%';
      showCelebration();
    } else {
      renderRound();
    }
  });

  restartBtn.addEventListener('click', startSession);
  playAgainBtn.addEventListener('click', startSession);
  modeSelect.addEventListener('change', startSession);
  difficultySelect.addEventListener('change', startSession);

  startSession();
</script>
</body>
</html>
